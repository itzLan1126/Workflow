name: Create release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ runner.temp }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag and source
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must match vX.Y.Z"
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag must point to a commit on main"
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test validator and deterministic tools
        run: python -m unittest discover -s tests
      - name: Validate skills
        run: python scripts/validation.py
      - name: Check every production script against the CRAP standard
        run: python scripts/self_crap.py > crap-result.json
      - name: Mutation-test every production script
        run: python scripts/self_mutation.py --json > mutation-result.json 2> mutation-run.log
      - name: Preserve quality evidence even when the strict gate fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-mutation
          path: |
            crap-result.json
            mutation-result.json
            mutation-run.log
            ${{ runner.temp }}/**/source-snapshot.json
            ${{ runner.temp }}/**/mutation.json
            ${{ runner.temp }}/**/measurements.json
            ${{ runner.temp }}/**/coverage.lcov
            ${{ runner.temp }}/**/config.json
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
