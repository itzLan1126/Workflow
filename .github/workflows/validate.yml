name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install validation dependencies
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-dev.txt
      - name: Test validator and deterministic tools
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests
      - name: Validate skills
        if: runner.os == 'Linux'
        run: python scripts/validation.py
      - name: Test native job ownership and timeout cleanup
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_windows_job.py -v
